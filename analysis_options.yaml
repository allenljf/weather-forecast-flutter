# Q30：flutter_lints + 手選規則 + strict-casts / strict-raw-types。
include: package:flutter_lints/flutter.yaml

# riverpod_lint 3.1.8 已改用 analysis_server_plugin，不再經由 custom_lint 安裝。
# 實測 Flutter 3.47.0 / Dart 3.13.0 的 `flutter analyze` 不會執行 plugin，
# 因此這裡只對 IDE 生效。Q30 已決定接受此缺口，CI 不把關 riverpod 規則。
plugins:
  riverpod_lint: ^3.1.8

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  # 下面四個平台目錄本專案不存在（Q17 只產 android/ios），但刪掉沒用：
  # 實測 flutter analyze 會印 "Upgrading analysis_options.yaml…" 自己寫回去。（F49）
  exclude:
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - omit_local_variable_types
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_enums
    - use_string_buffers
