    sdk: flutter

  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true
