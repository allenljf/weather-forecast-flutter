publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^3.4.2
  json_annotation: ^4.9.0
  riverpod_annotation: ^4.0.6

dev_dependencies:
